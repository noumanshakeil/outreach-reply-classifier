<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Paste inbound replies and route by intent label.</p>
<div class="grid"><section class="card">
<form method="post" action="/ui/replies"><label>Subject</label><input name="subject"/>
<label>Body</label><textarea name="body" rows="6" required></textarea><button type="submit">Classify</button></form>
</section><section class="card"><h2>Inbox</h2>
{% for r in replies %}<div><span class="pill">{{ r.label }}</span> <span class="pill">{{ r.confidence }}</span> {{ r.subject or r.body[:60] }}</div>{% endfor %}
</section></div></main></body></html>
